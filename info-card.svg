<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .title-bar { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .title-text { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #8b949e; font-weight: bold; }
    .terminal-text { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #c9d1d9; line-height: 1.5; }
    .highlight-blue { fill: #58a6ff; font-weight: bold; }
    .highlight-green { fill: #39d353; font-weight: bold; }
    .highlight-purple { fill: #bc8cff; font-weight: bold; }
    .highlight-orange { fill: #ff9b5e; font-weight: bold; }
    .muted { fill: #8b949e; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate {
      opacity: 0;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .delay-0 { animation-delay: 0.1s; }
    .delay-1 { animation-delay: 0.18s; }
    .delay-2 { animation-delay: 0.26s; }
    .delay-3 { animation-delay: 0.34s; }
    .delay-4 { animation-delay: 0.42s; }
    .delay-5 { animation-delay: 0.5s; }
    .delay-6 { animation-delay: 0.58s; }
    .delay-7 { animation-delay: 0.66s; }
    .delay-8 { animation-delay: 0.74s; }
    .delay-9 { animation-delay: 0.82s; }
    .delay-10 { animation-delay: 0.9s; }
    .delay-11 { animation-delay: 0.98s; }
    .delay-12 { animation-delay: 1.06s; }
    .delay-13 { animation-delay: 1.14s; }
    .delay-14 { animation-delay: 1.22s; }
    .delay-15 { animation-delay: 1.3s; }
  </style>
  <rect class="bg" width="490" height="490" rx="8" />
